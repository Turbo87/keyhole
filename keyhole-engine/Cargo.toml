[package]
name = "keyhole-engine"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
bytes = "1.11.1"
geographiclib-rs = { version = "0.2.7", default-features = false }
igc = "0.3.0"
jiff = { version = "1.0.1", default-features = false, features = ["std", "tzdb-bundle-always"] }
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
approx = "0.5.1"
insta = "1.49.0"
keyhole-handicaps = { path = "../keyhole-handicaps" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
