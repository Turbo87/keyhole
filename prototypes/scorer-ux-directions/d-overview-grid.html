<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Overview grid · Keyhole scorer UX prototype</title>
<link rel="stylesheet" href="shared/wire.css">
<style>
  .d-head { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .d-top { display: flex; align-items: center; gap: 14px; padding: 8px 16px 0; }
  .d-top a { text-decoration: none; }
  .d-brand { font-weight: 700; letter-spacing: 0.02em; }
  .d-tabs { display: flex; gap: 2px; padding: 6px 16px 0; flex-wrap: wrap; }
  .d-tabs a { padding: 6px 12px; text-decoration: none; color: var(--ink); border: 1px solid transparent; border-bottom: none; border-radius: 3px 3px 0 0; font-size: 13px; }
  .d-tabs a:hover { background: var(--fill); }
  .d-tabs a.on { border-color: var(--line); background: var(--fill); font-weight: 600; margin-bottom: -1px; }
  .d-tabs .sep { width: 1px; background: var(--line2); margin: 4px 8px; }
  .d-tabs .x { color: var(--mute); font-size: 11px; font-weight: 400; }
  .d-main { padding: 12px 20px 60px; }
  .d-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .d-title h1 { margin: 0; display: flex; gap: 8px; align-items: center; }
  .d-scroll { overflow: auto; border: 1px solid var(--line); max-height: 46vh; }
  .d-scroll.tall { max-height: none; }
  .d-mx { border-collapse: separate; border-spacing: 0; font-size: 12px; width: 100%; }
  .d-mx th, .d-mx td { border-right: 1px solid var(--line2); border-bottom: 1px solid var(--line2); padding: 0; text-align: left; vertical-align: top; }
  .d-mx thead th { position: sticky; top: 0; background: var(--fill); z-index: 2; padding: 4px 6px; font-weight: 600; }
  .d-mx thead th a { color: var(--ink); text-decoration: none; display: block; }
  .d-mx thead th.on { background: var(--ink); }
  .d-mx thead th.on a, .d-mx thead th.on .muted { color: var(--bg); }
  .d-mx th.rh { position: sticky; left: 0; background: var(--fill); z-index: 1; padding: 4px 8px; white-space: nowrap; font-weight: 400; }
  .d-mx thead th.rh { z-index: 3; }
  .d-mx tr.today th.rh { font-weight: 700; }
  .d-mx tr.today td { background: var(--fill); }
  .d-mx td a { display: block; padding: 4px 6px; min-height: 100%; text-decoration: none; color: var(--ink); }
  .d-mx td a:hover { background: var(--fill2); }
  .d-mx td.on a { outline: 2px solid var(--ink); outline-offset: -2px; background: var(--fill2); }
  .d-mx td.untouched a { color: var(--mute); background: repeating-linear-gradient(135deg, transparent 0 5px, var(--fill) 5px 10px); }
  .d-mx td.colsel { background: var(--fill); }
  .d-mx .l1 { display: flex; justify-content: space-between; gap: 6px; }
  .d-mx .l2 { color: var(--mute); font-size: 11px; }
  .d-mx.days td a { min-width: 150px; }
  .d-mx.res td { text-align: right; }
  .d-mx.res td a { padding: 3px 6px; min-width: 64px; white-space: nowrap; }
  .d-mx.res th.rh { padding: 3px 8px; }
  .d-mx.res .pts { font-weight: 600; font-variant-numeric: tabular-nums; }
  .d-mx.res .mk { font-size: 10px; color: var(--ink2); letter-spacing: 0.03em; }
  .d-mx.res td.chk a { box-shadow: inset 3px 0 0 var(--ink); }
  .d-mx.res td.unk .pts { color: var(--mute); font-weight: 400; }
  .d-mx.res td.na a { color: var(--line); }
  .d-legend { font-size: 11px; color: var(--mute); display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0 0; }
  .d-panel { margin-top: 14px; border: 1px solid var(--ink); background: var(--bg); }
  .d-panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--fill); flex-wrap: wrap; }
  .d-panel-head h2 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .d-panel-body { padding: 12px; }
  .d-panel .wf-tabs { margin: 0 0 12px; }
  .d-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(500px, 1fr); gap: 16px; align-items: start; }
  .d-split > .d-side { position: sticky; top: 92px; max-height: calc(100vh - 110px); overflow: auto; border: 1px solid var(--ink); }
  .d-split .d-panel { margin-top: 0; border: none; }
  .d-sections { position: sticky; top: 86px; z-index: 5; background: var(--bg); display: flex; gap: 4px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid var(--line2); margin-bottom: 14px; }
  .d-sec { scroll-margin-top: 140px; padding: 6px 0 22px; border-bottom: 1px solid var(--line2); margin-bottom: 18px; }
  .d-sec > h2 { margin-top: 0; }
  .d-attn { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12.5px; }
  .d-attn a { border: 1px dashed var(--ink2); padding: 3px 8px; border-radius: 3px; text-decoration: none; color: var(--ink); }
</style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/proto.js"></script>
<script src="shared/widgets.js"></script>
<script src="d-overview-grid.js"></script>
</body>
</html>
