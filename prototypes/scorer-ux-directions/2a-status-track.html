<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2A · Status track · Keyhole scorer UX prototype</title>
<link rel="stylesheet" href="shared/wire.css">
<link rel="stylesheet" href="shared/round2.css">
<style>
  .a2-track { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; margin: -4px 0 12px; font-size: 12.5px; }
  .a2-step { padding: 4px 12px 4px 18px; border: 1px solid var(--line); margin-left: -1px; color: var(--mute); background: var(--bg); clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%, 8px 50%); }
  .a2-step:first-child { padding-left: 12px; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%); }
  .a2-step.done { color: var(--ink2); background: var(--fill2); }
  .a2-step.cur { color: #fff; background: var(--ink); font-weight: 600; }
  .a2-step .sub { display: block; font-size: 11px; font-weight: 400; }
  .a2-cancel { padding: 4px 12px; border: 1px dashed var(--ink2); }
  .a2-after { display: flex; align-items: center; gap: 8px; margin-left: 12px; flex-wrap: wrap; }
  .a2-shared { margin-bottom: 14px; }
  .a2-shared summary { cursor: pointer; padding: 8px 12px; background: var(--fill); border: 1px solid var(--line); border-radius: var(--radius); }
  .a2-shared[open] summary { border-radius: var(--radius) var(--radius) 0 0; }
  .a2-shared > div { border: 1px solid var(--line); border-top: 0; padding: 12px; }
  .a2-cell .mk { font-size: 10px; color: var(--ink2); margin-right: 3px; letter-spacing: 0.02em; }
  @media (max-width: 800px) {
    .a2-step { padding: 3px 8px 3px 14px; font-size: 11.5px; }
    .a2-after { margin: 6px 0 0; width: 100%; }
  }
  .r2-st td.chk a { box-shadow: inset 3px 0 0 var(--ink); }
</style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/proto.js"></script>
<script src="shared/widgets.js"></script>
<script src="shared/round2.js"></script>
<script src="2a-status-track.js"></script>
</body>
</html>
