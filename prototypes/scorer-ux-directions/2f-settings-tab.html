<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2F · Settings tab · Keyhole scorer UX prototype</title>
<link rel="stylesheet" href="shared/wire.css">
<link rel="stylesheet" href="shared/round2.css">
<style>
  .f2-crumb-status { color: var(--ink2); font-weight: 600; }
  .f2-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; margin-bottom: 14px; border: 1px solid var(--ink2); border-radius: var(--radius); background: var(--fill); }
  .f2-bar .info { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
  .f2-bar .info b { font-size: 13.5px; }
  .f2-bar .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .f2-day .wf-box h3 { margin-top: 0; }
  .f2-cell { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
  .f2-cell .mk { font-size: 10px; color: var(--ink2); letter-spacing: 0.04em; min-height: 11px; }
  .f2-head { line-height: 1.15; }
  .f2-head .muted { font-weight: 400; font-size: 10.5px; }
</style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/proto.js"></script>
<script src="shared/widgets.js"></script>
<script src="shared/round2.js"></script>
<script src="2f-settings-tab.js"></script>
</body>
</html>
