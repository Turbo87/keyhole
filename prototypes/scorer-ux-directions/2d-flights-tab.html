<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D · Flights tab · Keyhole scorer UX prototype</title>
<link rel="stylesheet" href="shared/wire.css">
<link rel="stylesheet" href="shared/round2.css">
<style>
  .d2-pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--ink2); border-radius: 16px; padding: 3px 9px; font-size: 12px; font-weight: 400; white-space: nowrap; }
  .d2-change { display: inline-block; width: 7px; height: 7px; background: var(--ink); border-radius: 50%; }
  .d2-settings { margin-bottom: 14px; border: 1px solid var(--line); border-radius: var(--radius); }
  .d2-settings summary { cursor: pointer; padding: 9px 12px; background: var(--fill); }
  .d2-settings > div { padding: 12px; border-top: 1px solid var(--line); }
  .d2-missing { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .d2-status-menu { max-width: 420px; }
  .d2-status-menu select { width: 100%; }
  .d2-head { display: inline-flex; flex-direction: column; justify-content: center; width: 43px; min-height: 43px; border: 1px solid transparent; line-height: 1.3; }
  .d2-head small { font-size: 10px; font-weight: 400; }
  .d2-head.unplanned { color: var(--mute); }
  .d2-head.task-published { border: 1px dotted var(--ink); }
  .d2-head.preliminary { border: 1px dashed var(--ink); }
  .d2-head.unofficial { border: 1px solid var(--ink); }
  .d2-head.final { border: 3px solid var(--ink); }
  .d2-head.cancelled { border: 1px solid var(--mute); text-decoration: line-through; background: repeating-linear-gradient(135deg, transparent 0 4px, var(--line2) 4px 6px); }
  .r2-st thead th a:has(.d2-head) { padding: 4px; }
  .d2-cell small { font-size: 10px; margin-left: 3px; color: var(--ink2); }
  .d2-border-legend { align-items: center; gap: 8px 14px; }
  .d2-border-legend > span { display: inline-flex; align-items: center; gap: 5px; }
  .d2-border-legend .d2-head { width: 25px; min-height: 20px; font-size: 10px; }
  @media (max-width: 800px) {
    .wf-tabs a { padding: 7px 8px; }
    .d2-settings > div { padding: 8px; }
    .d2-settings .wf-form { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/proto.js"></script>
<script src="shared/widgets.js"></script>
<script src="shared/round2.js"></script>
<script src="2d-flights-tab.js"></script>
</body>
</html>
