<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4C · Inline tables · Keyhole scorer UX prototype</title>
<link rel="stylesheet" href="shared/wire.css">
<link rel="stylesheet" href="shared/round4.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
.r4c-table { table-layout: fixed; }
.r4c-table input:not([type=checkbox]), .r4c-table select { width: 100%; min-width: 0; box-sizing: border-box; }
.r4c-table input[type=checkbox] { accent-color: var(--ink); }
.r4c-table .r4c-main td { border-bottom: 0; }
.r4c-table .r4c-detail td { padding-top: 0; padding-bottom: 10px; }
.r4c-table tbody.r4c-new { background: var(--fill); }
.r4c-table tbody.r4c-selected { outline: 2px solid var(--ink2); outline-offset: -2px; }
.r4c-table tbody.r4c-deleted { color: var(--mute); background: var(--fill); }
.r4c-table .r4c-crew { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.r4c-table .r4c-crew + .r4c-crew { margin-top: 4px; }
.r4c-table .r4c-actions { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.r4c-table .r4c-actions .wf-btn { padding: 4px 7px; }
.r4c-table summary { font-size: 12px; color: var(--mute); cursor: pointer; }
.r4c-table details[open] > .wf-stack { margin-top: 10px; }
.r4c-table .wf-form { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.r4c-table .wf-stack { gap: 10px; }
.r4c-chip { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 6px 8px; margin: 0; }
.r4c-chip .wf-field { flex: 1 1 130px; min-width: 0; }
.r4c-chip .wf-field:first-child { flex-basis: 210px; }
.r4c-chip .wf-btn { margin-bottom: 1px; }
.r4c-link-list { display: flex; flex-direction: column; gap: 6px; }
.r4c-subhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 18px 0 8px; }
.r4c-subhead h2 { margin: 0; font-size: 17px; }
.r4c-help { margin: 0 0 12px; }
.r4c-table .r4c-new-label { font-size: 11px; margin-bottom: 4px; display: block; color: var(--mute); }
@media (max-width: 1150px) {
  .r4c-table { table-layout: auto; }
  .r4c-table .r4c-main input:not([type=checkbox]), .r4c-table .r4c-main select { min-width: 65px; }
  .r4c-table .r4c-main .r4c-crew { min-width: 190px; }
}
@media (max-width: 800px) {
  .r4c-table, .r4c-table tbody, .r4c-table tr, .r4c-table td { display: block; width: auto; }
  .r4c-table colgroup, .r4c-table thead { display: none; }
  .r4c-table tbody { border: 1px solid var(--line); border-radius: 4px; padding: 8px; margin-bottom: 12px; }
  .r4c-table .r4c-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .r4c-table .r4c-main td { padding: 0; min-width: 0; }
  .r4c-table .r4c-main td::before { content: attr(data-label); display: block; font-size: 12px; margin-bottom: 3px; color: var(--mute); }
  .r4c-table .r4c-main td.r4c-wide { grid-column: 1 / -1; }
  .r4c-table .r4c-main .r4c-crew { min-width: 0; }
  .r4c-table .r4c-detail td { padding: 10px 0 0; border: 0; }
  .r4c-table .wf-form { grid-template-columns: minmax(0, 1fr); }
  .r4c-table .wf-field input, .r4c-table .wf-field select { max-width: 100%; }
  .r4c-chip .wf-field { flex-basis: 140px; }
}
</style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/proto.js"></script>
<script src="shared/widgets.js"></script>
<script src="shared/round4.js"></script>
<script src="4c-inline-tables.js"></script>
</body>
</html>
