<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E · Checklists · Keyhole scorer UX prototype</title>
<link rel="stylesheet" href="shared/wire.css">
<style>
  .e-head { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 8px 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .e-head a { text-decoration: none; }
  .e-head a.on { font-weight: 700; text-decoration: underline; }
  .e-brand { font-weight: 700; letter-spacing: 0.02em; }
  .e-main { max-width: 1240px; margin: 0 auto; padding: 16px 24px 80px; }
  .e-crumbs { font-size: 12.5px; color: var(--mute); margin-bottom: 6px; }
  .e-crumbs a { color: var(--mute); }
  .e-title { margin-bottom: 12px; }
  .e-title h1 { margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* horizontal stepper for a class day */
  .e-steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin: 4px 0 16px; border: 1px solid var(--line); }
  .e-step { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; text-decoration: none; color: var(--ink); border-right: 1px solid var(--line); background: var(--bg); }
  .e-step:last-child { border-right: 0; }
  .e-step:hover { background: var(--fill2); }
  .e-step.on { background: var(--fill); box-shadow: inset 0 -3px 0 var(--ink); }
  .e-step .t { font-weight: 600; }
  .e-step .s { font-size: 12px; color: var(--mute); }
  .e-num { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ink2); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .e-num.done { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .e-num.next { border-width: 3px; }
  .e-num.skip { border-style: dashed; color: var(--mute); border-color: var(--mute); }

  /* vertical rail for setup */
  .e-split { display: grid; grid-template-columns: 250px 1fr; gap: 24px; align-items: start; }
  .e-rail { position: sticky; top: 60px; border: 1px solid var(--line); background: var(--fill); padding: 8px 0; }
  .e-rail a { display: flex; gap: 10px; align-items: center; padding: 6px 12px; text-decoration: none; color: var(--ink); border-left: 3px solid transparent; }
  .e-rail a:hover { background: var(--fill2); }
  .e-rail a.on { background: var(--bg); border-left-color: var(--ink); font-weight: 600; }
  .e-rail .h { padding: 4px 12px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mute); }
  .e-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }

  /* checklist items */
  .e-list { border: 1px solid var(--line); }
  .e-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line2); }
  .e-item:first-child { border-top: 0; }
  .e-item .sub { font-size: 12.5px; color: var(--mute); }
  .e-item.done .main { color: var(--mute); }
  .e-box { width: 18px; height: 18px; border: 1.5px solid var(--ink2); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .e-box.done { background: var(--ink); color: var(--bg); }
  .e-queue { display: flex; flex-wrap: wrap; gap: 4px; }
  .e-queue a { font-size: 11.5px; padding: 1px 6px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .e-queue a.on { background: var(--ink); color: var(--bg); }
  .e-queue a.done { color: var(--mute); text-decoration: line-through; }
</style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/proto.js"></script>
<script src="shared/widgets.js"></script>
<script src="e-checklists.js"></script>
</body>
</html>
