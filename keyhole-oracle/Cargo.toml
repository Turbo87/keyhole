[package]
name = "keyhole-oracle"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
bytes = "1.11.1"
csv = "1.4.0"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
jiff = { version = "1.0.1", default-features = false, features = ["std", "serde", "tzdb-bundle-always"] }
keyhole-engine = { path = "../keyhole-engine" }
rayon = "1.12.0"
regex = "1.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
