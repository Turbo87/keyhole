# SWO racing task in the Club class with handicaps on the 1.000 scale and two
# hors concours competitors, where no competitor flew a handicapped distance of
# at least Dm. The class day fails the DAeC n1/N rule and every day score is 0.

rule_set = "DAeC SWO 2026"
original_rule_set = "DAeC SWO 2024"
handicapped = true

# !! n1/N <= 25% -> Day not valid and has to be canceled !!; Dm = 100km,
# D1 = 250km, handicapping enabled; Use PEV disabled,  N: 14, n1: 0, n2: 0,
# Do: 97,76km, Vo: 0,00km/h; DAeC-SWO2024 Script V9.07
[published_day_parameters]
valid = false
d1 = 250
n = 14
n1 = 0
n2 = 0
do = 97.76
vo = 0.00
