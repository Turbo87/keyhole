# SWO racing task where only 3 of 29 competitors who reached Dm finished, so
# FCR reduces the day's points. One competitor has a penalty and one an
# official warning.

edition = "DAeC SWO 2026"
flown_under = "DAeC SWO 2024"

# The task info line says "handicapping enabled", but the class has no
# Handicap column and the published values reproduce without handicaps, so the
# class is unhandicapped.
[class]
dm = 120
d1 = 300
handicapped = false

[class.rule_overrides]
