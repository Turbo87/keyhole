# ; Use PEV disabled,  N: 31, n1: 29, n2: 3, Do: 330,46km, Vo: 104,16km/h
# ; DAeC-SWO2024 Script V9.06
[published_day_parameters]
d1 = 300
n = 31
n1 = 29
n2 = 3
do = 330.46
vo = 104.16
f = 1.000
fcr = 0.724
